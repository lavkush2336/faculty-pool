  <script>
    // Load departments dynamically via API endpoint (e.g., departments.php)
    async function loadDepartments() {
      const container = document.getElementById('departmentsContainer');
      container.innerHTML = '<p class="text-center">Loading departments...</p>';
      try {
        const res = await fetch('departments.php'); // Your PHP endpoint returning JSON
        const data = await res.json();
        container.innerHTML = '';

        if (!data.success || !data.departments.length) {
          container.innerHTML = '<p class="text-center text-muted">No departments found.</p>';
          return;
        }

        data.departments.forEach(dept => {
          const deptDiv = document.createElement('div');
          deptDiv.className = 'dept-card';
          deptDiv.innerHTML = `
            <div class="dept-icon"><i class="${dept.icon_class || 'fas fa-building'}"></i></div>
            <div class="dept-main">
              <span class="dept-name">${dept.name}</span>
              <p class="dept-desc text-sm text-slate-500 mt-2">${dept.description || ''}</p>
            </div>
          `;

          if (dept.branches && dept.branches.length > 0) {
            const btn = document.createElement('button');
            btn.className = 'creative-button small toggle-branches mt-2';
            btn.innerHTML = `<i class="fas fa-angle-down"></i> View Branches (${dept.branches.length})`;
            const branchList = document.createElement('ul');
            branchList.className = 'list-group mt-2 hidden';
            branchList.id = `branches-${dept.id}`;
            dept.branches.forEach(b => {
              const li = document.createElement('li');
              li.className = 'list-group-item d-flex justify-content-between align-items-center';
              li.innerHTML = `
                <div>
                  <strong>${b.name}</strong>
                  <div class="small text-muted">${b.description || ''}</div>
                </div>
                ${b.page_link ? `<a href="${b.page_link}" target="_blank" class="btn btn-sm btn-outline-primary">Open</a>` : ''}
              `;
              branchList.appendChild(li);
            });

            btn.addEventListener('click', () => branchList.classList.toggle('hidden'));
            deptDiv.appendChild(btn);
            deptDiv.appendChild(branchList);
          }

          container.appendChild(deptDiv);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = '<p class="text-center text-danger">Error loading departments.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      AOS && AOS.init && AOS.init({ duration: 800, easing: 'ease-in-out', once: true, offset: 100 });
      loadDepartments();
    });
  </script>
